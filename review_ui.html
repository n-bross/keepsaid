'use strict';
const $=s=>document.querySelector(s);

const PAGE_SIZE=40,drafts=new Map(),personDrafts=new Map(),textOpen=new Set(),nameEdits=new Map(),wordRemoval=new Set(),wordUndo=new Map(),wordSaving=new Set();
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function button(text,cls,action){const b=el('button',cls,text);b.type='button';if(action)b.onclick=action;return b}
let noticeTimer;function status(text,error=false){clearTimeout(noticeTimer);$('#status').textContent=text;$('#status').className='notice'+(error?' error':'');if(text&&!error)noticeTimer=setTimeout(()=>{$('#status').textContent=''},6000)}
async function api(path,options){const r=await fetch(path,options);const d=await r.json();if(!r.ok)throw Error(d.error||'Anfrage fehlgeschlagen.');return d}
function post(path,data){return api(path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(data)})}
function releasePlayer(){cancelAnimationFrame(wordFrame);wordFrame=0;for(const w of activeWords)w.classList.remove("spoken");activeWords.clear();activeWord=null;wordIndex=[];++playIntent;audioRequest?.abort();audioPromise=null;audioReadyName=null;const a=$('#main-audio');a.onloadedmetadata=null;a.pause();a.removeAttribute('src');a.dataset.recording='';a.load();$('#audio-note').textContent=''}
function pauseAudio(){document.querySelectorAll('audio').forEach(a=>a.pause())}
function timeLabel(t){const centis=Math.round(t*100);return `${Math.floor(centis/6000)}:${String(Math.floor(centis/100)%60).padStart(2,'0')}.${String(centis%100).padStart(2,'0')}`}
function recordingDate(r){if(r.aufgenommen){const d=new Date(r.aufgenommen);if(!Number.isNaN(d.getTime()))return new Intl.DateTimeFormat('de-DE',{dateStyle:'medium',timeStyle:'short'}).format(d)}const m=r.name.match(/^(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})/);return m?`${m[3]}.${m[2]}.${m[1]} · ${m[4]}:${m[5]}`:r.name}
function durationLabel(t){const seconds=Math.max(0,Math.round(t||0));return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')} min`}
function clockInput(t){return timeLabel(t).replace('.',',')}
function parseClock(value){const m=String(value).trim().match(/^(\d+):([0-5]?\d)(?:[.,](\d{1,3}))?$/);return m?Number(m[1])*60+Number(m[2])+Number('0.'+(m[3]||'0')):NaN}
function namedPerson(sp){return sp.name&&!/^Person\s+\d+$/i.test(sp.name.trim())}
function skipAudio(delta){const a=$('#main-audio');playAt(Math.max(0,Math.min(detail?.dauer||0,(a.currentTime||0)+delta)))}
function paintPerson(node,name){if(!name)return;let hash=0;for(const c of name.toLocaleLowerCase('de-DE'))hash=(Math.imul(hash,31)+c.codePointAt(0))>>>0;const hue=hash%360;node.style.setProperty('--person-ink',`hsl(${hue} 46% 34%)`);node.style.setProperty('--person-soft',`hsl(${hue} 58% 94%)`);node.classList.add('colored-person')}
function postText(segment,text){return post('api/textblock',{aufnahme:detail.name,block:segment.id,version:segment.version,vorher:segment.text,text})}
function audioInfo(){return noiseFilter?detail.audio_bereinigt:detail.audio}
async function refreshProcessing(){if(!detail||!Object.values(detail.moss||{}).some(s=>s.status!=='bereit')||textOpen.size||nameEdits.size||personDrafts.size)return;const epoch=loadId,recording=detail.name;try{const d=await api('api/aufnahme?name='+encodeURIComponent(recording));if(epoch!==loadId||selected!==recording||textOpen.size||nameEdits.size||personDrafts.size)return;const a=$('#main-audio'),position=a.currentTime,playing=!a.paused,changed=noiseFilter&&detail.audio_bereinigt?.version!==d.audio_bereinigt?.version;if(changed)releasePlayer();applyDetail(d,epoch);if(changed){if(playing)playAt(position);else if(await prepareAudio(recording,epoch)){if(a.readyState)a.currentTime=position;else a.onloadedmetadata=()=>{a.currentTime=position;a.onloadedmetadata=null}}}}catch(e){}}
async function batchStatus(){clearTimeout(batchTimer);try{const d=await api('api/moss'),root=$('#batch-progress'),labels={filter:'MossFormer2',groq:'Groq',macbook:'MacBook'};root.hidden=!Object.values(d).some(s=>s.gesamt&&s.fertig<s.gesamt);if(!root.hidden){root.textContent=Object.entries(d).map(([p,s])=>`${labels[p]} ${s.fertig}/${s.gesamt}`).join(' · ');refreshProcessing();batchTimer=setTimeout(batchStatus,20000)}}catch(e){batchTimer=setTimeout(batchStatus,30000)}}
function appendVariantPage(body,data,start){const words=data.words||[],end=Math.min(start+40,data.segments.length);for(const segment of data.segments.slice(start,end)){const p=el('p');let lo=0,hi=words.length;while(lo<hi){const mid=(lo+hi)>>1;if((words[mid].start+words[mid].end)/2<segment.start-.01)lo=mid+1;else hi=mid}let count=0;for(let i=lo;i<words.length&&(words[i].start+words[i].end)/2<=segment.end+.01;i++){const w=words[i],b=button(w.word,'word',()=>seekAudio(w.start));b.dataset.start=w.start;b.dataset.end=w.end;b.setAttribute('aria-label',`${w.word} ab ${timeLabel(w.start)} abspielen`);p.append(b,document.createTextNode(' '));count++}if(!count)p.textContent=segment.text;body.append(p)}if(end<data.segments.length){const more=button('Mehr anzeigen','quiet',()=>{more.remove();appendVariantPage(body,data,end);refreshWordIndex()});body.append(more)}}
function renderNewTranscript(){const root=$('#new-transcript'),state=detail.neutranskript||{},epoch=loadId;root.replaceChildren();root.hidden=true;if(state.status==='bereit'&&state.geschuetzt){const box=el('details');box.append(el('summary','','Alternative Fassung'),el('div','new-transcript-text',state.vergleich||'Keine Sprache erkannt.'));root.append(box);root.hidden=false}for(const [provider,label] of [['groq','Groq'],['macbook','MacBook']]){const run=detail.moss?.[provider];if(!run)continue;root.hidden=false;const box=el('details','transcript-version'),title=el('summary','',`${label}${run.status==='bereit'?'':run.status==='laeuft'?` · ${run.fortschritt} %`:run.status==='fehler'?' · neuer Versuch folgt':' · eingeplant'}`);box.append(title);let loaded=false;box.ontoggle=async()=>{refreshWordIndex();if(!box.open||loaded||run.status!=='bereit')return;loaded=true;const body=el('div','new-transcript-text','Lädt …');box.append(body);try{const response=await api('api/moss-fassung?'+new URLSearchParams({name:detail.name,anbieter:provider}));if(epoch!==loadId)return;body.replaceChildren();const data=response.daten;if(!data)return;appendVariantPage(body,data,0);if(!data.segments.length)body.textContent='Keine Sprache erkannt.';refreshWordIndex()}catch(e){body.textContent=e.message;loaded=false}};root.append(box)}}
function person(id){return detail.sprecher.find(s=>s.id===id)}
function personNumber(id){return detail.sprecher.findIndex(s=>s.id===id)+1}
function personLabel(id){return person(id)?.name||(id==='__unzugeordnet__'?'Noch ohne Sprecher':`Person ${personNumber(id)||'?'}`)}
function initials(name){return name.trim().split(/\s+/).slice(0,2).map(x=>Array.from(x)[0]||'').join('').toUpperCase()}
function dot(name){return el('span','person-dot',initials(name))}
function heading(r){$('#title').textContent=r.titel||'Aufnahme ohne Titel';$('#recording-date').textContent=recordingDate(r)}
function nav(){const root=$('#recordings');root.replaceChildren();const query=$('#search').value.toLocaleLowerCase();for(const r of recordings.filter(r=>`${r.titel||''} ${r.name} ${recordingDate(r)}`.toLocaleLowerCase().includes(query))){const b=button('','record',()=>choose(r.name));b.setAttribute('aria-current',String(r.name===selected));b.append(el('strong','',r.titel||'Aufnahme ohne Titel'),el('small','',recordingDate(r)+(Number.isFinite(r.dauer)?' · '+durationLabel(r.dauer):'')));root.append(b)}if(!root.children.length)root.append(el('p','','Keine passende Aufnahme.'))}
async function load(refresh=false){$('#refresh').disabled=true;try{const d=await api('api/aufnahmen'+(refresh?'?neu=1':''));recordings=d.aufnahmen;token=d.token;$('#total').textContent=`(${recordings.length})`;nav();batchStatus();if(selected)await choose(selected,false);else await showDashboard()}catch(e){status(e.message,true)}finally{$('#refresh').disabled=false}}
async function showDashboard(){readingOpen=false;clearTimeout(readingTimer);++readingRequest;detailRequest?.abort();summaryController?.abort();releasePlayer();++loadId;clearTimeout(wordTimer);pauseAudio();selected=null;detail=null;$('#recording-view').hidden=true;$('#dashboard').hidden=false;nav();status('');const id=++dashboardId;$('#dashboard-content').replaceChildren(el('div','loading','Kennzahlen und offene Aufnahmen werden geladen …'));try{const d=await api('api/dashboard');if(id!==dashboardId||selected)return;renderDashboard(d)}catch(e){if(id===dashboardId&&!selected)$('#dashboard-content').replaceChildren(el('div','empty',e.message),button('Erneut laden','',showDashboard))}}
function renderDashboard(d){const root=$('#dashboard-content');root.replaceChildren();const stats=el('div','stats');for(const [label,value] of [['Aufnahmen',d.aufnahmen_gesamt],['Personen',d.personen_gesamt],['Bestätigte Stimmen',d.zuordnungen_bestaetigt]]){const card=el('div','stat');card.append(el('span','',label),el('strong','',String(value)));stats.append(card)}const progress=el('div','progress-panel'),heading=el('div','progress-heading'),track=el('div','progress-track'),bar=el('span'),percent=d.stimmen_gesamt?Math.round(100*d.zuordnungen_bestaetigt/d.stimmen_gesamt):0;heading.append(el('strong','','Sprecherzuordnung'),el('span','',`${percent} % geprüft`));bar.style.width=percent+'%';track.append(bar);progress.append(heading,track);const queueHead=el('div','queue-heading');queueHead.append(el('h2','','Offene Zuordnungen'),el('span','',`${d.offene_aufnahmen.length} ${d.offene_aufnahmen.length===1?'Aufnahme':'Aufnahmen'}`));root.append(stats,progress,queueHead);if(d.nicht_geladen)root.append(el('p','',`${d.nicht_geladen} Aufnahmen konnten nicht geprüft werden. Bitte später neu laden.`));if(!d.offene_aufnahmen.length){root.append(el('div','empty','Alle Sprecher zugeordnet.'));return}const queue=el('div','queue');for(const r of d.offene_aufnahmen){const b=button('','queue-row',()=>choose(r.name,true,r.segment)),caption=el('span','queue-caption');caption.append(el('strong','',r.titel),el('small','',recordingDate(r)+(Number.isFinite(r.dauer)?' · '+durationLabel(r.dauer):'')));b.append(dot('▹'),caption,el('span','badge',`${r.offen} offen`),el('span','arrow','→'));queue.append(b)}root.append(queue)}
async function choose(name,reset=true,focusSegment=null){readingOpen=false;clearTimeout(readingTimer);++readingRequest;$('#reading').hidden=true;$('#read-version').textContent='Lesefassung';$('#read-version').setAttribute('aria-pressed','false');detailRequest?.abort();summaryController?.abort();const controller=new AbortController();detailRequest=controller;const id=++loadId;pauseAudio();if($('#main-audio').dataset.recording!==name)releasePlayer();selected=name;detail=null;clearTimeout(wordTimer);wordPolls=0;++dashboardId;$('#recording-view').hidden=false;$('#dashboard').hidden=true;$('#summary').hidden=true;$('#summarize').textContent='Zusammenfassung erstellen';$('#summarize').onclick=createSummary;if(reset){page=0;onlyPending=false}nav();heading(recordings.find(r=>r.name===name)||{name});$('#people').replaceChildren();$('#toolbar').hidden=true;$('#history').replaceChildren();$('#pager').replaceChildren();$('#segments').replaceChildren(el('div','loading','Audio und Text werden geladen …'));status('');try{const d=await api('api/aufnahme?name='+encodeURIComponent(name),{signal:controller.signal});if(id!==loadId)return;detail=d;if(focusSegment!==null)page=Math.max(0,Math.floor((detail.bloecke||[]).findIndex(b=>b.parts.some(p=>p.segment===focusSegment))/PAGE_SIZE));render();loadSummary();if(focusSegment!==null)document.getElementById('segment-'+(detail.bloecke||[]).find(b=>b.parts.some(p=>p.segment===focusSegment))?.id)?.scrollIntoView({block:'center'})}catch(e){if(e.name!=='AbortError'&&id===loadId){status(e.message,true);$('#segments').replaceChildren(el('div','empty','Aufnahme konnte nicht geöffnet werden. Bitte erneut auswählen.'))}}}
function applyDetail(d,epoch){if(epoch!==loadId||selected!==d.name)return false;detail=d;render();loadSummary();if(readingOpen)loadReading();return true}
function speakerIds(segment){return [...new Set((segment.bereiche||[]).map(b=>b.speaker))]}
function pending(segment){return !speakerIds(segment).length||speakerIds(segment).some(id=>!person(id)?.name)}

function renderPersonForms(root,segment){root.replaceChildren();const key=detail.name+':'+segment.id;for(const row of personDrafts.get(key)||[]){const form=el('form','person-form'),head=el('div','person-form-head');head.append(el('h3','','Weitere Person'),button('✕','quiet',()=>{const rows=(personDrafts.get(key)||[]).filter(x=>x.id!==row.id);if(rows.length)personDrafts.set(key,rows);else personDrafts.delete(key);renderPersonForms(root,segment)}));head.lastChild.setAttribute('aria-label','Personeneingabe entfernen');const grid=el('div','form-grid'),name=el('input'),start=el('input'),end=el('input');name.value=row.name;name.placeholder='Name';name.maxLength=120;name.required=true;name.setAttribute('list','names');for(const input of [start,end]){input.type='text';input.inputMode='decimal';input.required=true;input.placeholder='0:00,00';input.pattern='[0-9]+:[0-5]?[0-9]([.,][0-9]{1,3})?'}start.value=clockInput(row.start);end.value=clockInput(row.ende);const nameField=field('Name',name,`person-name-${row.id}`);nameField.className='wide';grid.append(nameField,field('Von',start,`person-start-${row.id}`),field('Bis',end,`person-end-${row.id}`));const range=el('div','time-range wide'),out=el('output','sr-only'),lo=el('input'),hi=el('input'),lower=Math.max(0,Math.min(Number(row.start),segment.playback_start??segment.start)),upper=Math.min(detail.dauer,Math.max(Number(row.ende),segment.playback_end??segment.end));for(const input of [lo,hi]){input.type='range';input.min=lower;input.max=upper;input.step='.01'}lo.value=row.start;hi.value=row.ende;lo.setAttribute('aria-label','Beginn des Zeitbereichs verschieben');hi.setAttribute('aria-label','Ende des Zeitbereichs verschieben');const note=el('p'),audio=el('audio','preview-audio');function changed(){audio.pause();audio.hidden=true;audio.removeAttribute('src');out.textContent=`${clockInput(row.start)} – ${clockInput(row.ende)}`}name.oninput=()=>row.name=name.value;for(const [input,prop,slider] of [[start,'start',lo],[end,'ende',hi]
